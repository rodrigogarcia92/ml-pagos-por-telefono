name: CI

# Runs the offline test suite on every push and pull request.
#
# The tests use a synthetic panel -- no BigQuery, no BCRP API, no MLflow server,
# no credentials. That is deliberate (plan 4.0: dataset.py takes a
# snapshot path, never a connection), and it is what lets CI exist without any
# secret. Do NOT add a step that needs Google credentials to this workflow.
#
# A second job that builds the Docker image on a Linux runner is planned
# (roadmap step 12).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Tests (the six that guard against silent leaks, plus the rest)
        run: python -m pytest

      - name: Lint
        run: |
          pip install ruff
          ruff check .
