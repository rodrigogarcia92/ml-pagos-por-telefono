name: Monthly refresh

# Fetch new BCRP data -> BigQuery -> dbt -> snapshot -> forecast -> drift check, then open a pull
# request with the new raw JSON, the forecast files and monitor.json. All of it is
# scripts/monthly_refresh.py; this file only provides the machine, the credentials and the paperwork.
#
# Authentication is Workload Identity Federation: there is no JSON key anywhere. One-time setup
# (pool, provider, service account, roles, the two secrets) is docs/RUNBOOK.md, section
# "Monthly refresh and holdout".
#
# Outcomes
#   new month forecast   -> pull request "forecast: <target month>"
#   no new month         -> nothing is opened, the job succeeds
#   monitor says alert   -> an issue labelled `drift-alert` is opened (or commented on)
#   a stage fails        -> an issue labelled `refresh-failed` is opened, then the job fails
#
# Note: pull requests opened with the default GITHUB_TOKEN do not trigger other workflows, so the
# forecast PR does not run CI. It changes data and forecasts, not code.

on:
  workflow_dispatch:
    inputs:
      skip_etl:
        description: >-
          Skip fetch, load and dbt: take a fresh snapshot from the warehouse as it is now and
          forecast from it (CI has no local snapshot, so the snapshot stage still runs).
        type: boolean
        default: false

  # Enable AFTER the first successful manual run (Actions -> Monthly refresh -> Run workflow).
  # BCRP publishes about once a month at no fixed day; three tries a month are idempotent, because
  # a run that finds no new published month opens nothing. Times are UTC (13:50 = 08:50 Lima).
  # schedule:
  #   - cron: "50 13 10 * *"
  #   - cron: "50 13 20 * *"
  #   - cron: "50 13 28 * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: monthly-refresh
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: pagos-telefono-26
  BQ_DATASET_RAW: raw
  BQ_DATASET_STAGING: staging
  BQ_DATASET_MARTS: marts
  PYTHONUTF8: "1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dbt.txt

      # Two environments, never one: dbt pins jinja2 / click / protobuf ranges that collide with
      # MLflow's (the same reason as locally, docs/RUNBOOK.md section 1).
      - name: Install the application environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Install the dbt environment
        run: |
          python -m venv .venv-dbt
          .venv-dbt/bin/python -m pip install --upgrade pip
          .venv-dbt/bin/pip install -r requirements-dbt.txt

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # dbt reads its connection from profiles.yml. Generated here, per run, and never committed
      # (it is in .gitignore). method: oauth uses the credentials the auth step just exported.
      - name: Write the dbt profile
        run: |
          mkdir -p "$RUNNER_TEMP/dbt"
          cat > "$RUNNER_TEMP/dbt/profiles.yml" <<'EOF'
          pagos_dbt:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: pagos-telefono-26
                dataset: staging
                location: US
                threads: 4
                job_retries: 1
                job_execution_timeout_seconds: 300
          EOF
          echo "DBT_PROFILES_DIR=$RUNNER_TEMP/dbt" >> "$GITHUB_ENV"
          echo "DBT_BIN=$GITHUB_WORKSPACE/.venv-dbt/bin/dbt" >> "$GITHUB_ENV"

      - name: Install dbt packages
        working-directory: pagos_dbt
        run: ../.venv-dbt/bin/dbt deps

      # Never fails the step itself: the exit code (0 done, 2 drift alert, 1 a stage failed) is
      # captured and acted on below, so the issue and PR steps always get to run. Any code other
      # than 0 and 2 (including a crash before the script starts) counts as a failed refresh.
      - name: Refresh
        id: refresh
        env:
          SKIP_ETL: ${{ inputs.skip_etl }}
        run: |
          args=""
          if [ "$SKIP_ETL" = "true" ]; then args="--from-stage snapshot"; fi
          set +e
          .venv/bin/python scripts/monthly_refresh.py $args
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Read the run summary
        id: summary
        if: always()
        run: |
          f=forecasts/last_refresh.json
          if [ -f "$f" ]; then
            echo "outcome=$(jq -r '.outcome' "$f")" >> "$GITHUB_OUTPUT"
            echo "target_month=$(jq -r '.target_month // ""' "$f")" >> "$GITHUB_OUTPUT"
            echo "monitor_status=$(jq -r '.monitor_status // ""' "$f")" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Make sure the labels exist
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create forecast --color 1d76db --description "Monthly forecast" || true
          gh label create drift-alert --color d93f0b --description "Forecast monitor: two consecutive misses" || true
          gh label create refresh-failed --color b60205 --description "Monthly refresh stage failed" || true

      - name: Compose the pull request body
        if: steps.summary.outputs.outcome == 'forecast'
        run: |
          rec=$(ls forecasts/forecast_*.json | sort | tail -1)
          {
            echo "## Forecast for $(jq -r '.target_month' "$rec")"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Point forecast | **$(jq -r '.point_forecast' "$rec")** $(jq -r '.unit' "$rec") |"
            echo "| 80% band | $(jq -r '.band_80 | "\(.[0]) .. \(.[1])"' "$rec") |"
            echo "| 90% band | $(jq -r '.band_90 | "\(.[0]) .. \(.[1])"' "$rec") |"
            echo "| Origin / data version | $(jq -r '.origin' "$rec") / \`$(jq -r '.data_version' "$rec")\` |"
            echo "| Last observed | $(jq -r '.last_actual | "\(.month): \(.value)"' "$rec") |"
            echo "| Model | \`$(jq -r '.model_id' "$rec")\`, config \`$(jq -r '.config_hash' "$rec")\` |"
            echo
            echo "Band basis: $(jq -r '.band_basis' "$rec")."
            echo
            echo "## Drift monitor: \`$(jq -r '.status' forecasts/monitor.json)\`"
            echo
            echo "- Months scored so far: $(jq -r '.n_scored' forecasts/monitor.json)"
            echo "- Rolling MAPE: $(jq -r '.rolling_mape_pct // "n/a"' forecasts/monitor.json)%"
            echo "- Band coverage: 80% -> $(jq -r '.coverage.within_80 // "n/a"' forecasts/monitor.json), 90% -> $(jq -r '.coverage.within_90 // "n/a"' forecasts/monitor.json)"
            echo "- Reason: $(jq -r '.reason // "none"' forecasts/monitor.json)"
            echo
            echo "Contains the new raw BCRP JSON (\`data/raw/bcrp/\`), the forecast files and \`forecasts/monitor.json\`."
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/pr_body.md"

      - name: Open the forecast pull request
        if: steps.summary.outputs.outcome == 'forecast'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: forecast/${{ steps.summary.outputs.target_month }}
          base: ${{ github.event.repository.default_branch }}
          title: "forecast: ${{ steps.summary.outputs.target_month }}"
          commit-message: "forecast: ${{ steps.summary.outputs.target_month }}"
          body-path: ${{ runner.temp }}/pr_body.md
          add-paths: |
            data/raw/bcrp/*.json
            forecasts/**
          labels: forecast
          delete-branch: true

      - name: Open (or comment on) the drift-alert issue
        if: steps.refresh.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "The monthly monitor reports **alert**: the two latest scored months were both off by more than 10%."
            echo
            echo "- $(jq -r '.reason // "see forecasts/monitor.json"' forecasts/monitor.json)"
            echo "- Rolling MAPE: $(jq -r '.rolling_mape_pct' forecasts/monitor.json)%"
            echo "- Run: $run_url"
          } > "$RUNNER_TEMP/alert.md"
          existing=$(gh issue list --label drift-alert --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/alert.md"
          else
            gh issue create --label drift-alert --title "Forecast drift alert" --body-file "$RUNNER_TEMP/alert.md"
          fi

      - name: Open a refresh-failed issue
        if: steps.refresh.outputs.failed == 'true' || steps.refresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          f=forecasts/last_refresh.json
          {
            if [ -f "$f" ] && [ "$(jq -r '.error' "$f")" != "null" ]; then
              echo "Stage **$(jq -r '.error.stage' "$f")** failed ($(jq -r '.error.kind' "$f"))."
              echo
              echo "$(jq -r '.error.detail' "$f")"
              echo
              echo "Command: \`$(jq -r '.error.command' "$f")\`"
              echo
              echo "Last lines of its output:"
              echo '```'
              jq -r '.error.stderr_tail' "$f"
              echo '```'
            else
              echo "The refresh failed before it could write a summary. See the run log."
            fi
            echo
            echo "Run: $run_url"
          } > "$RUNNER_TEMP/failed.md"
          gh issue create --label refresh-failed --title "Monthly refresh failed" --body-file "$RUNNER_TEMP/failed.md"

      - name: Fail the job if a stage failed
        if: steps.refresh.outputs.failed == 'true' || steps.refresh.outcome == 'failure'
        run: |
          echo "A stage of the monthly refresh failed; see the refresh-failed issue." >&2
          exit 1
