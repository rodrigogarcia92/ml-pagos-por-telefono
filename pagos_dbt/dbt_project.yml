name: 'pagos_dbt'
version: '1.0.0'

# Must match the profile key in ~/.dbt/profiles.yml (written by `dbt init`).
profile: 'pagos_dbt'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

vars:
  # SINGLE-PULL RULE for Google Trends (docs/training_plan.md 4.5, 9.2). Trends rescales
  # each request to its own peak, so a data_version takes the WHOLE history from one pull.
  # This is that pull: the latest one that passed the data gate (scripts/trends_gate.py).
  # 2026-10-05 is the first pull; the gate is still "pending" on G2 (one pull so far).
  # Advance it deliberately, together with a new snapshot -- never implicitly.
  trends_pull_id: '2026-10-05'

clean-targets:
  - "target"
  - "dbt_packages"

models:
  pagos_dbt:
    # staging: thin, cheap, always fresh. Views cost nothing to store and are
    # recomputed on read — right for a layer whose only job is cleaning.
    staging:
      +materialized: view
      +schema: staging

    # marts: materialised as tables. They are read repeatedly by modelling code,
    # and a table is scanned far more cheaply than a view that re-runs a pivot
    # across 21 series every time someone selects from it.
    marts:
      +materialized: table
      +schema: marts
