version: 2

models:
  - name: stg_bcrp_observations
    description: >
      One row per (series, month) — the latest pull wins. This is the only
      model that reads raw.bcrp_observations; everything else reads this.
    columns:
      - name: series_code
        description: BCRP series code.
        data_tests:
          - not_null
          # Passes by construction since 2026-09-05: the model inner-joins to
          # metadata, so an observation without a metadata row cannot survive.
          # Kept as a regression guard on that join, not as a live assertion.
          # The test that carries information now is the reverse direction, on
          # stg_series_metadata below.
          - relationships:
              arguments:
                to: ref('stg_series_metadata')
                field: series_code
      - name: obs_date
        description: First day of the observation month.
        data_tests:
          - not_null
      - name: value
        description: >
          Observed value. Nullable on purpose — BCRP returns "n.d." for months
          it has not published yet, and the parser maps that to NULL rather
          than inventing a zero.
      - name: pulled_at
        data_tests:
          - not_null

    data_tests:
      # BigQuery enforces no primary keys. This is the assertion that replaces
      # one — versioned, reviewable, and re-checked on every build. If the
      # de-duplication above ever breaks, this test fails loudly instead of
      # quietly poisoning the feature matrix.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - series_code
              - obs_date

  - name: stg_series_metadata
    description: >
      Series labels and categories, projected from config.py. A CURRENT
      DECLARATION, rewritten on every loader run -- unlike raw.bcrp_observations,
      which is an immutable archive. Retiring a series removes it here and
      leaves its history there; stg_bcrp_observations reconciles the two.
    columns:
      - name: series_code
        data_tests:
          - not_null
          - unique
          # THE ONE THAT EARNS ITS KEEP. Every declared series must actually
          # have observations. Catches the realistic failure after a config
          # edit: a mistyped BCRP code, which would otherwise appear as a panel
          # column that is silently NULL for all 200 months.
          # Split by source (v1.7): Trends rows live in stg_trends, not here.
          - relationships:
              name: relationships_stg_series_metadata_bcrp_have_observations
              arguments:
                to: ref('stg_bcrp_observations')
                field: series_code
              config:
                where: "category != 'search_interest'"
          - relationships:
              name: relationships_stg_series_metadata_trends_have_observations
              arguments:
                to: ref('stg_trends')
                field: series_code
              config:
                where: "category = 'search_interest'"
      - name: col_name
        description: Becomes a column name in marts.monthly_panel.
        data_tests:
          - not_null
          - unique
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['target', 'macro', 'complementary', 'pagos_agregados', 'search_interest']

  - name: stg_trends
    description: >
      Google Trends, ONE pull, ONE row per month: yape + plin in index points
      (training_plan.md 4.5). The single-pull rule lives here -- the pull is
      var('trends_pull_id') in dbt_project.yml (latest pull that passed the data gate).
      Never mix months from two pulls: Trends rescales each request.
    columns:
      - name: series_code
        data_tests:
          - not_null
      - name: obs_date
        data_tests:
          - not_null
      - name: value
        description: Consolidated index (yape + plin), 0-200. NULL if an entity is missing.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 200
                inclusive: true
      - name: pull_id
        description: The one pull this model reads.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - series_code
              - obs_date
