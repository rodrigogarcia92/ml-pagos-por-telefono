version: 2

sources:
  - name: raw
    database: pagos-telefono-26
    schema: raw
    description: >
      Append-only landing tables written by the Python ETL
      (src/data_collection/load_to_bigquery.py). Never written by dbt, and
      never read by anything downstream except the staging models below.

    tables:
      - name: bcrp_observations
        description: >
          One row per (series, month, pull). Re-pulls APPEND rather than
          overwrite, so the full revision history is preserved — BCRP revises
          recently published figures, and overwriting would destroy the
          evidence that a number changed. De-duplication to "latest pull wins"
          happens in stg_bcrp_observations.
        columns:
          - name: series_code
            description: BCRP series code, exactly as returned by the API.
          - name: obs_date
            description: First day of the observation month.
          - name: value
            description: >
              Observed value. FLOAT64 rather than NUMERIC — these are measured
              economic quantities, not money summed to the cent.
          - name: pulled_at
            description: When this row's snapshot was fetched from the API.
          - name: source_batch
            description: Filename in data/raw/bcrp/ that produced this row.

      - name: trends_observations
        description: >
          Google Trends, one row per (pull, entity, month): Yape ("Aplicación") and
          Plin ("Tema") from ONE request per pull, as exported, complete months only
          (src/data_collection/load_trends.py). Append-only; every pull is kept.
          Trends is relative (0-100, rescaled per request), so months from different
          pulls are not comparable: stg_trends applies the single-pull rule.
        columns:
          - name: pull_id
            description: The pull date (YYYY-MM-DD), the filename prefix in data/raw/google_trends/.
          - name: pull_date
            description: The same date as a DATE.
          - name: series_code
            description: Always GT_YAPE_PLIN (config.TRENDS_SERIES).
          - name: entity
            description: "'yape' or 'plin'."
          - name: obs_date
            description: First day of the observation month.
          - name: value
            description: Index points, 0-100 ("<1" read as 0.5 by the parser).
          - name: source_batch
            description: CSV filename that produced this row.

      - name: series_metadata
        description: >
          Human-readable labels for each series code. A projection of
          src/data_collection/config.py, rewritten in full on every load
          (WRITE_TRUNCATE) so it cannot drift from the source of truth.
        columns:
          - name: series_code
            description: Primary key.
          - name: col_name
            description: >
              Analysis-friendly column name. Convention: n_ = número (count of
              operations), v_ = valor/monto in soles. These become the column
              names of marts.monthly_panel.
          - name: category
            description: "'target' | 'macro' | 'complementary' | 'pagos_agregados' | 'search_interest'"
