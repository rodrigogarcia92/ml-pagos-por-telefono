version: 2

models:
  - name: monthly_panel
    description: >
      Wide feature matrix: one row per month, one column per BCRP series.
      The table modelling code reads. Column list is generated from
      raw.series_metadata at compile time, so it tracks config.py automatically.
    columns:
      - name: obs_date
        description: First day of the month.
        data_tests:
          - not_null
          - unique
      - name: n_transf_intra_yape
        description: Yape intrabank transfers — count. Jan 2024 onwards.
      - name: v_transf_intra_yape
        description: Yape intrabank transfers — value. Jan 2024 onwards.
      - name: ipc
        description: CPI. Available from 2010 in this panel, 1991 at source.
      - name: gt_yape_plin
        description: >
          Google Trends, Yape (Aplicación) + Plin (Tema), Peru, index points (sum, one
          request). 2017-01 to the last complete month, ONE pull (stg_trends, single-pull
          rule). A relative index: model it only as log differences (training_plan.md 4.2).
          Zero until 2021 -- see the data gate.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 200
                inclusive: true

  - name: fct_wallet_metrics
    description: >
      Derived Yape/Plin measures — wallet splits, shares, average ticket and
      month-over-month growth. One row per month from Jan 2024.
    columns:
      - name: obs_date
        data_tests:
          - not_null
          - unique
      - name: n_total
        description: Total Yape + Plin operations (intrabank + interbank).
        data_tests:
          - not_null
      - name: yape_share_valor
        description: Yape's share of total Yape+Plin value. Between 0 and 1.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: yape_share_numero
        description: Yape's share of total Yape+Plin operation count.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: ticket_promedio_raw
        description: >
          v_total / n_total. UNITS UNVERIFIED — see the model comment. Do not
          quote as soles until the BCRP scaling factors are confirmed.
      - name: n_total_mom
        description: Month-over-month growth in operation count. NULL in the first month.

  - name: series_coverage
    description: >
      Coverage audit, one row per series: first and last observation, how many
      months it spans, and whether there are holes inside that span. Exists so
      the difference between a structural edge NULL (series not yet born) and
      an interior NULL (a real defect) is asserted on every build rather than
      eyeballed once. See docs/training_plan.md 4.0.
    columns:
      - name: col_name
        description: Panel column this series populates.
        data_tests:
          - not_null
          - unique
      - name: category
        description: target | macro | complementary | pagos_agregados.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['target', 'macro', 'complementary', 'pagos_agregados', 'search_interest']
      - name: first_obs
        data_tests:
          - not_null
      - name: last_obs
        data_tests:
          - not_null
      - name: n_values
        description: Count of non-null observations after de-duplication.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 24
                inclusive: true
      - name: interior_gaps
        description: >
          span_months - n_values. MUST be zero. A non-zero value means a month
          is missing inside the series' own coverage, which would silently
          corrupt any lag or moving average built from it. This is the test
          that makes the ragged panel safe to build features from.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0
                inclusive: true
      - name: months_behind_panel_edge
        description: >
          Staleness relative to the freshest series in the panel. A cross-check
          on the publication lags in training_plan.md 4.1 -- informational, not
          asserted, because it also moves with the ETL run date.
        data_tests:
          - not_null
