model_family: xgboost
encoding: int             # a tree splits on the integer perfectly well
# CPU hist, n_jobs=1 -- see registry.py. A GPU is slower at this size.
tune:
  max_depth: [2, 3, 4]
  learning_rate: [0.01, 0.05, 0.1]
  n_estimators: [200, 600]
  subsample: [0.7, 1.0]
  colsample_bytree: [0.5, 0.8]
  min_child_weight: [1, 5]
  reg_lambda: [1, 10]
