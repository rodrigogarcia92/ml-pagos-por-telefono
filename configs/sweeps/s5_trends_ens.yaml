# s5_trends_ens -- the ens3 ensemble on FS3_activity only. 12 parents, Stage A + B.
# training_plan.md section 7.4 (ens3, P3-P4, D2), 9.2 step 6.
#
# The Google Trends test is CLOSED AS A NEGATIVE RESULT (plan 9.2, O-14, section 11 2026-10-06):
# G1 FAIL and G3 FAIL on the 2026-10-05 pull, CV period only. FS3_gt, the gt_* features and the
# Trends code stay in the repo but are NOT swept; a later pull does not re-open G1/G3.
#
#   3 targets (t3, t10, t11) x 4 families (svr_rbf, rf, xgboost, ens3) x 1 set = 12
#
#   FS3_activity  the production feature set for count targets (22 tree / 32 linear columns)
#
# ens3 = equal-weight mean of the SVR, random-forest and XGBoost z-forecasts, each member
# tuned in its OWN Stage A on its full s2 grid (svr 36, rf 54, xgboost 288 candidates) with
# its own encoding of the same feature set. No weights are estimated.
#
# BEFORE RUNNING
#   1. A snapshot exists and the s1b t3 controls were run on that same snapshot.
#   2. `--dry-run` shows 12.
#
# DECISION RULES (7.4, fixed before running; D3: no change after s5 has been read):
#   D2  ensemble adopted only if ens3 is not worse than its best member by > 1 SE at every horizon
#   (D1 is closed: Trends not adopted. P1, P2 are moot without FS3_gt.)
#
#   python -m src.model_training.sweep --config configs/sweeps/s5_trends_ens.yaml --dry-run
#   python -m src.model_training.sweep --config configs/sweeps/s5_trends_ens.yaml --jobs 4
#
# Interrupting is safe: finished runs are skipped on restart (same tag set, data_version and
# protocol_version).

name: s5_trends_ens
protocol_version: "1.7"

targets: [t3, t10, t11]
windows: [w2019]
stage: cv

models:
  - svr_rbf
  - rf
  - xgboost
  - ens3

feature_sets:
  - FS3_activity
