# s6_holdout -- Stage C, the one-time holdout. TWO parents. Do not run this file directly:
#
#     python scripts/run_holdout.py              # prints what it would run, exits 0
#     python scripts/run_holdout.py --confirm    # the real run -- once, ever
#
# plan 6.1, 7.3 (Stage C), 11 (marker "PRODUCTION-FREEZE t3_ens3 v1" holds the rule).
#
#   t3 (h=3) x w2019 x { ens3 x FS3_activity, naive_drift x none } = 2 parents
#
# Stage C = one expanding, purged fold per holdout origin: the final 12 TARGET months of the
# window (2025-08 .. 2026-07 on snapshot 20261005T000000Z). Hyperparameters are NOT tuned here:
#   ens3         the frozen members from configs/production/t3_ens3.yaml (Stage A on the CV period)
#   naive_drift  its Stage A on the CV rows, as in every CV run (the grid is 3 candidates)
# The comparison is exactly these two forecasts; nothing is re-tuned, re-selected or re-run
# after the result is seen.

name: s6_holdout
protocol_version: "1.7"

targets: [t3]
windows: [w2019]
stage: holdout

models:
  - ens3
  - naive_drift

feature_sets:
  - FS3_activity

frozen:
  ens3: configs/production/t3_ens3.yaml
